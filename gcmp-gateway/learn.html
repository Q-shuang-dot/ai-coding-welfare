<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GCMP 学习中心</title>
<style>
:root {
  --bg: #07111f; --bg-2: #0b1626; --bg-3: #0d1e31;
  --panel: rgba(12,19,31,0.82); --panel-strong: rgba(14,23,38,0.96);
  --panel-soft: rgba(19,31,49,0.82);
  --border: rgba(148,163,184,0.18); --text: #edf4ff; --muted: #9aa9c2;
  --accent: #69a9ff; --accent-2: #8b5cf6; --accent-3: #2dd4bf;
  --ok: #3ddc97; --warn: #fbbf24; --err: #f87171;
  --radius: 18px; --shadow: 0 18px 45px rgba(2,6,23,0.55);
  --hover: rgba(255,255,255,.04); --track: rgba(255,255,255,.08);
  --code-bg: rgba(255,255,255,.06); --link-hover: #a5d0ff;
  --glow-1: rgba(100,163,255,0.2); --glow-2: rgba(139,92,246,0.18);
  --switch-bg: rgba(15,23,42,0.25);
  --warn-soft: rgba(251,191,36,.08); --err-soft: rgba(248,113,113,.15);
}
:root[data-theme="light"] {
  --bg: #edf4ff; --bg-2: #f7f9ff; --bg-3: #e9f1ff;
  --panel: rgba(255,255,255,0.9); --panel-strong: rgba(255,255,255,0.98);
  --panel-soft: rgba(244,247,255,0.96);
  --border: rgba(100,116,139,0.22); --text: #14233d; --muted: #53657f;
  --accent: #2563eb; --accent-2: #7c3aed; --accent-3: #0284c7;
  --ok: #0f9f6e; --warn: #b45309; --err: #dc2626;
  --shadow: 0 18px 42px rgba(15,23,42,0.08);
  --hover: rgba(15,23,42,.05); --track: rgba(15,23,42,.09);
  --code-bg: rgba(15,23,42,.06); --link-hover: #1d4ed8;
  --glow-1: rgba(37,99,235,0.10); --glow-2: rgba(124,58,237,0.08);
  --switch-bg: rgba(255,255,255,0.38);
  --warn-soft: rgba(180,83,9,.10); --err-soft: rgba(220,38,38,.10);
}
:root[data-theme="aurora"] {
  --bg: #090e1e; --bg-2: #101a32; --bg-3: #0f1c3d;
  --panel: rgba(15,23,42,0.82); --panel-strong: rgba(17,27,48,0.96);
  --panel-soft: rgba(18,30,54,0.88);
  --border: rgba(125,211,252,0.2); --text: #ebf8ff; --muted: #a2c6f4;
  --accent: #3dd9ff; --accent-2: #8b5cf6; --accent-3: #22c55e;
  --ok: #5ee7a5; --warn: #fbbf24; --err: #fb7185;
  --shadow: 0 18px 45px rgba(1,8,20,0.6);
  --hover: rgba(125,211,252,.07); --track: rgba(125,211,252,.12);
  --code-bg: rgba(125,211,252,.09); --link-hover: #a5edff;
  --glow-1: rgba(61,217,255,0.18); --glow-2: rgba(139,92,246,0.2);
  --switch-bg: rgba(9,14,30,0.4);
  --warn-soft: rgba(251,191,36,.1); --err-soft: rgba(251,113,133,.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; background: var(--bg-3); }
body {
  background: radial-gradient(circle at 12% 0%, var(--glow-1), transparent 20%),
    radial-gradient(circle at 88% 0%, var(--glow-2), transparent 20%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 22%, var(--bg-3) 100%);
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--text); font: 14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;
  padding: 22px 18px 28px; min-height: 100vh;
}
.shell { max-width: 1400px; margin: 0 auto; }
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--link-hover); }
button {
  cursor: pointer; border: 1px solid var(--border);
  background: linear-gradient(180deg,var(--panel-strong),var(--panel));
  color: var(--text); border-radius: 10px; padding: 7px 14px; font-size: 13px;
  transition: transform .15s, border-color .15s, box-shadow .15s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 6px 16px rgba(2,6,23,0.18);
}
button:hover { border-color: var(--accent); transform: translateY(-1px); }
button.primary { background: linear-gradient(135deg,var(--accent),var(--accent-2)); border-color: transparent; color: #fff; font-weight: 700; }
input, select, textarea { background: var(--panel-strong); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; width: 100%; transition: border-color .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(96,165,250,.72); box-shadow: 0 0 0 3px rgba(96,165,250,.12); }

/* topbar */
.topbar {
  position: sticky; top: 12px; z-index: 20;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-bottom: 24px; padding: 14px 18px; border: 1px solid var(--border);
  background: linear-gradient(180deg,var(--panel),var(--panel-strong));
  backdrop-filter: blur(14px); border-radius: 18px; box-shadow: var(--shadow);
}
.topbar h1 { font-size: 18px; font-weight: 700; margin-right: auto; }
.topbar h1 small { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; }
.tabs { display: flex; gap: 4px; }
.tab-btn {
  padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
  border: 1px solid transparent; background: transparent; color: var(--muted);
  box-shadow: none; transition: background .15s, color .15s, border-color .15s;
}
.tab-btn:hover { color: var(--text); background: var(--hover); border-color: var(--border); transform: none; }
.tab-btn.active { color: var(--text); background: var(--panel-strong); border-color: var(--accent); box-shadow: 0 0 0 1px rgba(96,165,250,.15); }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--accent); color: #fff; font-weight: 600; }
.theme-switch {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px; border-radius: 12px;
  background: var(--switch-bg); border: 1px solid var(--border);
}
.theme-btn {
  padding: 5px 10px; border-radius: 9px; font-size: 12px; font-weight: 600;
  background: transparent; border: 0; box-shadow: none; color: var(--muted);
}
.theme-btn:hover { transform: none; color: var(--text); }
.theme-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; box-shadow: 0 8px 18px rgba(96,165,250,0.22);
}

/* panels */
.panel {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow);
  padding: 20px; margin-bottom: 18px;
}
.panel-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.panel-title .sub { font-weight: 400; font-size: 12px; color: var(--muted); }

/* progress bar */
.progress-bar {
  height: 6px; background: var(--track); border-radius: 3px; overflow: hidden;
}
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 3px; transition: width .4s ease; }

/* week cards */
.week-card { border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; background: var(--panel-soft); }
.week-card h3 { font-size: 15px; margin-bottom: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.week-card h3:hover { color: var(--accent); }
.week-card .wk-caret { font-size: 11px; color: var(--muted); transition: transform .18s; }
.week-card .wk-count {
  margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted);
  padding: 1px 8px; border-radius: 20px; background: var(--track);
}
.week-card .wk-count.all { color: #fff; background: var(--ok); }
.week-card.collapsed .wk-caret { transform: rotate(-90deg); }
.week-card.collapsed .wk-body { display: none; }
.week-card.collapsed { padding-bottom: 12px; }
.week-card .why { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.week-card .output { font-size: 12px; color: var(--accent-3); margin-bottom: 12px; }
.task-row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; cursor: pointer; }
.task-row input[type=checkbox] { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
.task-row .task-title { flex: 1; font-size: 13px; }
.task-row .task-title.done { text-decoration: line-through; color: var(--muted); }
.task-row .task-detail { font-size: 12px; color: var(--muted); margin-top: 2px; display: none; }
.task-row .task-detail.open { display: block; }
.task-row .task-note {
  font-size: 11px; color: var(--accent); margin-left: 6px; cursor: pointer;
  padding: 1px 6px; border-radius: 6px; background: var(--hover); white-space: nowrap;
}
.task-row .task-note:hover { background: var(--track); text-decoration: underline; }

/* knowledge base */
.search-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.search-bar input { flex: 1; min-width: 200px; }
.search-bar select { width: auto; min-width: 120px; }
.kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
.kb-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px; background: var(--panel-soft); cursor: pointer; transition: border-color .2s; }
.kb-card:hover { border-color: var(--accent); }
.kb-card .kb-cat { font-size: 11px; color: var(--accent-3); font-weight: 600; margin-bottom: 2px; }
.kb-card .kb-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.kb-card .kb-q { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.kb-card .kb-a { font-size: 13px; line-height: 1.7; display: none; }
.kb-card .kb-a.open { display: block; }
.kb-card .kb-a code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.kb-card mark { background: var(--warn-soft); color: var(--warn); padding: 0 2px; border-radius: 3px; font-weight: 600; }
.kb-empty { grid-column: 1 / -1; padding: 24px; text-align: center; font-size: 13px; color: var(--muted); }

/* 代码块 */
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin: 6px 0; overflow-x: auto;
}
pre code {
  background: none; padding: 0; font-size: 12px; line-height: 1.55;
  font-family: Consolas, "Cascadia Mono", monospace; white-space: pre;
}
.kb-card .mastery-row { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
.mastery-btn { padding: 3px 10px; font-size: 11px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); }
.mastery-btn.active { border-color: var(--accent); color: var(--accent); }
.mastery-btn.active.m0 { border-color: var(--err); color: var(--err); }
.mastery-btn.active.m1 { border-color: var(--warn); color: var(--warn); }
.mastery-btn.active.m2 { border-color: var(--ok); color: var(--ok); }
.kb-card .core-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; background: var(--err-soft); color: var(--err); font-weight: 600; margin-left: 6px; }

/* stories */
.story-card { border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--panel-soft); }
.story-card h3 { font-size: 15px; margin-bottom: 4px; }
.story-card .tag { font-size: 11px; color: var(--accent-3); font-weight: 600; margin-bottom: 8px; }
.story-card .star { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.star-item { font-size: 13px; }
.star-item .label { font-size: 11px; color: var(--muted); font-weight: 600; }
.story-card .key { font-size: 12px; color: var(--warn); margin-top: 8px; padding: 8px; background: var(--warn-soft); border-radius: 8px; }

/* Q&A */
.qa-item { border-bottom: 1px solid var(--border); padding: 10px 0; cursor: pointer; }
.qa-item:last-child { border: none; }
.qa-item .q { font-size: 13px; font-weight: 600; display: flex; gap: 8px; }
.qa-item .q .cat { font-size: 10px; color: var(--accent-3); font-weight: 400; }
.qa-item .a { font-size: 13px; line-height: 1.7; display: none; margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--accent); }
.qa-item .a.open { display: block; }
.qa-item .self { display: none; gap: 6px; margin-top: 8px; padding-left: 12px; }
.qa-item .a.open + .self { display: flex; }
.qa-item .self .tip { font-size: 11px; color: var(--muted); align-self: center; margin-right: 2px; }
.qa-item.done-0 .q::after { content: "😅"; }
.qa-item.done-1 .q::after { content: "🤔"; }
.qa-item.done-2 .q::after { content: "✅"; }

/* 今日待办 */.today-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px;
  background: var(--panel-soft);
}
.today-item .kind { font-size: 11px; font-weight: 700; color: var(--accent-3); white-space: nowrap; padding-top: 2px; }
.today-item .body { flex: 1; }
.today-item .title { font-size: 13px; font-weight: 600; }
.today-item .detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
.today-empty { font-size: 13px; color: var(--muted); padding: 8px 0; }

/* 模拟面试 */
.mock-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.mock-pos { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.mock-timer { font-family: Consolas, monospace; font-size: 14px; font-weight: 700; white-space: nowrap; }
.mock-q {
  font-size: 17px; font-weight: 600; line-height: 1.6; padding: 20px;
  border: 1px solid var(--border); border-radius: 14px; background: var(--panel-soft);
  min-height: 90px; display: flex; align-items: center;
}
.mock-q .mock-cat { font-size: 11px; color: var(--accent-3); font-weight: 600; margin-right: 8px; }
.mock-a {
  font-size: 13px; line-height: 1.75; margin-top: 12px; padding: 14px 16px;
  border-left: 2px solid var(--accent); background: var(--hover); border-radius: 0 10px 10px 0;
  display: none;
}
.mock-a.open { display: block; }
.mock-a code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.mock-row {
  display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px;
  border-radius: 8px; border-left: 3px solid var(--border); margin-bottom: 6px;
  background: var(--panel-soft);
}
.mock-row.lv0 { border-left-color: var(--err); }
.mock-row.lv1 { border-left-color: var(--warn); }
.mock-row.lv2 { border-left-color: var(--ok); }
.mock-row .mq { flex: 1; font-size: 13px; }
.mock-row .mv { font-size: 12px; white-space: nowrap; }
.mock-hist { display: flex; gap: 8px; flex-wrap: wrap; }
.mock-hist-item {
  font-size: 11px; padding: 5px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-soft); color: var(--muted);
}
.mock-hist-item b { color: var(--text); }

/* 速查表 */
.cheat-cat { font-size: 13px; font-weight: 700; color: var(--accent-3); margin: 14px 0 6px; }
.cheat-cat:first-child { margin-top: 0; }
.cheat-row {
  display: flex; gap: 10px; padding: 7px 10px; border-radius: 8px;
  border-left: 2px solid var(--border); margin-bottom: 4px;
}
.cheat-row:hover { background: var(--hover); }
.cheat-row.is-core { border-left-color: var(--accent); }
.cheat-row .ct { width: 210px; flex-shrink: 0; font-size: 12px; font-weight: 600; }
.cheat-row .ck { font-size: 12px; color: var(--muted); line-height: 1.55; }
.cheat-row .ck code { background: var(--code-bg); padding: 0 4px; border-radius: 3px; }
.cheat-row .m2 { color: var(--ok); }

/* 打印：只留速查表，去掉背景和交互元素 */
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .topbar, .tab-btn, #cheatCatFilter, .btn-sm, label { display: none !important; }
  .tab-content { display: none !important; }
  #tab-cheat { display: block !important; }
  .panel { border: none; box-shadow: none; padding: 0; background: none; }
  .cheat-row { break-inside: avoid; border-left-color: #999; }
  .cheat-row .ck, .cheat-row .ct { color: #000; }
  .cheat-cat { color: #000; border-bottom: 1px solid #999; }
}

/* 统计 */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat-box { border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.stat-box .num { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-box .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cat-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
.cat-row .name { width: 110px; color: var(--muted); flex-shrink: 0; }
.cat-row .bar { flex: 1; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; display: flex; }
.cat-row .bar i { display: block; height: 100%; }
.cat-row .bar i.m2 { background: var(--ok); }
.cat-row .bar i.m1 { background: var(--warn); }
.cat-row .val { width: 52px; text-align: right; color: var(--muted); flex-shrink: 0; }

/* flashcard */
.flashcard { max-width: 600px; margin: 0 auto; text-align: center; }
.flashcard .card { min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel-soft); cursor: pointer; }
.flashcard .card .q { font-size: 18px; font-weight: 600; }
.flashcard .card .a { font-size: 14px; line-height: 1.7; display: none; width: 100%; text-align: left; }
.flashcard .card .a.open { display: block; }
.flashcard .card .a code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.flashcard .card .hint { font-size: 12px; color: var(--muted); margin-top: 16px; }
.flashcard .controls { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
kbd {
  font-family: Consolas, monospace; font-size: 10px; padding: 1px 4px; margin-left: 3px;
  border: 1px solid var(--border); border-radius: 4px; background: var(--track); color: var(--muted);
}
button.primary kbd { border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.18); color: #fff; }

/* JD map */
.jd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.jd-row { border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; }
.jd-row .jd-jd { font-weight: 600; margin-bottom: 2px; }
.jd-row .jd-your { color: var(--muted); }
.jd-row .jd-level { font-size: 11px; color: var(--warn); font-weight: 600; }

/* resources */
.res-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.res-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.res-item .cat { font-size: 11px; color: var(--accent-3); font-weight: 600; }
.res-item .title { font-size: 14px; font-weight: 600; margin: 2px 0; }
.res-item .note { font-size: 12px; color: var(--muted); }

/* tab content */
.tab-content { display: none; }
.tab-content.active { display: block; }

/* misc */
.flex { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.mt-8 { margin-top: 8px; }
.mb-8 { margin-bottom: 8px; }
.text-muted { color: var(--muted); }
.text-center { text-align: center; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.hidden { display: none; }

/* 滚动条跟随主题 */
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border); border-radius: 999px;
  border: 3px solid transparent; background-clip: content-box;
}
::-webkit-scrollbar-corner { background: transparent; }

/* 全站统一精修：克制专业 */
body { padding: 18px; letter-spacing: .01em; }
.shell { max-width: 1320px; }
.topbar {
  top: 10px; gap: 12px; margin-bottom: 20px; padding: 12px 14px;
  border-radius: 14px; box-shadow: 0 10px 30px rgba(2,6,23,.26);
}
.topbar h1 { font-size: 17px; letter-spacing: .015em; }
.topbar h1 small { display: block; margin: 1px 0 0; font-size: 11px; }
.tabs { gap: 2px; align-items: center; }
.tab-btn { padding: 7px 10px; border-radius: 8px; font-size: 12px; }
.tab-btn:nth-child(5) { margin-left: 7px; padding-left: 15px; border-left-color: var(--border); }
.tab-btn.active { background: var(--panel-soft); box-shadow: inset 0 -2px 0 var(--accent); border-color: transparent; }
.badge { padding: 3px 8px; background: color-mix(in srgb, var(--accent) 82%, #0f172a); }
.theme-switch { gap: 2px; padding: 3px; border-radius: 9px; }
.theme-btn { padding: 4px 8px; font-size: 11px; }
button { border-radius: 8px; padding: 7px 12px; box-shadow: none; }
button:hover { box-shadow: 0 5px 14px rgba(2,6,23,.18); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: none;
}
input, select, textarea { border-radius: 8px; background: var(--panel-strong); }
.panel {
  padding: 18px; margin-bottom: 14px; border-radius: 14px;
  box-shadow: 0 8px 24px rgba(2,6,23,.16);
}
.panel-title { margin-bottom: 12px; font-size: 15px; }
.panel-title .sub { margin-left: 2px; }
.progress-bar { height: 5px; }
.week-card, .kb-card, .story-card, .today-item, .jd-row, .res-item,
.stat-box, .flashcard .card, .mock-q, .mock-row {
  border-radius: 10px; box-shadow: none;
}
.week-card { padding: 14px; margin-bottom: 10px; }
.week-card h3 { font-size: 14px; }
.task-row { padding: 7px 2px; }
.search-bar { gap: 8px; margin-bottom: 12px; }
.kb-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.kb-card { padding: 13px; }
.kb-card .kb-title { font-size: 13px; }
.story-card { padding: 14px; margin-bottom: 10px; }
.story-card .star { gap: 10px; }
.qa-item { padding: 11px 2px; }
.qa-item .q { align-items: baseline; }
.today-item { padding: 11px 12px; margin-bottom: 6px; }
.today-item .kind {
  min-width: 34px; padding: 2px 6px; border-radius: 5px;
  background: var(--hover); text-align: center;
}
.mock-head { gap: 9px; margin-bottom: 12px; }
.mock-q { min-height: 100px; padding: 18px; font-size: 16px; }
.mock-a { margin-top: 10px; padding: 12px 14px; }
.mock-row { padding: 8px 10px; margin-bottom: 4px; }
.flashcard { max-width: 720px; }
.flashcard .card { min-height: 220px; padding: 26px; }
.flashcard .controls, .controls { gap: 7px; }
.cheat-row { padding: 8px 10px; margin-bottom: 2px; }
.cheat-row .ct { width: 230px; }
.stat-grid { gap: 8px; margin-bottom: 12px; }
.stat-box { padding: 10px; background: var(--panel-soft); }
.stat-box .num { font-size: 20px; }
.res-list { gap: 8px; }
.res-item { padding: 12px; background: var(--panel-soft); }

@media (max-width: 920px) {
  body { padding: 12px; }
  .topbar { position: static; display: grid; grid-template-columns: 1fr auto; }
  .topbar h1 { grid-column: 1; }
  .tabs {
    grid-column: 1 / -1; width: 100%; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex: 0 0 auto; }
  .theme-switch { justify-self: end; }
}

@media (max-width: 640px) {
  body { padding: 8px; font-size: 13px; }
  .topbar { gap: 8px; padding: 11px; margin-bottom: 12px; border-radius: 12px; }
  .topbar h1 { font-size: 16px; }
  .topbar h1 small { display: none; }
  .tab-btn { padding: 7px 9px; }
  .tab-btn:nth-child(5) { margin-left: 4px; padding-left: 12px; }
  .theme-btn { padding: 4px 6px; }
  .panel { padding: 14px; margin-bottom: 10px; border-radius: 12px; }
  .panel-title { align-items: flex-start; flex-direction: column; gap: 2px; }
  .panel-title .sub { margin: 0; }
  .search-bar > input { min-width: 100%; }
  .search-bar > select { flex: 1; min-width: 0; }
  .search-bar > button { width: 100%; }
  .kb-grid, .jd-grid { grid-template-columns: 1fr; }
  .story-card .star { grid-template-columns: 1fr; }
  .today-item { align-items: stretch; flex-wrap: wrap; }
  .today-item .body { min-width: calc(100% - 52px); }
  .today-item > div:last-child { width: 100%; padding-left: 44px; }
  .today-item > div:last-child button { width: 100%; }
  .mock-head { flex-wrap: wrap; }
  .mock-head .progress-bar { order: 3; flex-basis: 100%; }
  .mock-q { min-height: 120px; padding: 15px; font-size: 15px; }
  .flashcard .card { min-height: 190px; padding: 20px; }
  .flashcard .controls button { flex: 1 1 calc(50% - 7px); }
  .cheat-row { display: block; }
  .cheat-row .ct { display: block; width: auto; margin-bottom: 3px; }
  .cat-row .name { width: 88px; }
}
</style>

  </div>

  <!-- Tab: 今日 -->
  <div class="tab-content active" id="tab-today">
    <div class="panel">
      <div class="panel-title">☀️ 今日待办 <span class="sub" id="todaySummary"></span></div>

    </div>
    <div class="panel">

  <!-- Tab: 计划 -->

        <button class="btn-sm" onclick="collapseAllWeeks(true)">全部收起</button>
        <button class="btn-sm" onclick="collapseAllWeeks(false)">全部展开</button>

    </div>
    <div id="planContainer"></div>
  </div>

  <!-- Tab: 知识库 -->

      <div class="search-bar">
        <input type="text" id="kbSearch" placeholder="搜索知识点…（/ 聚焦，Esc 清空）" oninput="renderKB()">
        <select id="kbCatFilter" onchange="renderKB()"><option value="">全部分类</option></select>
        <select id="kbMasteryFilter" onchange="renderKB()">

        <span class="badge" id="kbCount" style="align-self:center">0 / 0</span>
        <button class="primary" onclick="document.querySelectorAll('.kb-a').forEach(e=>e.classList.toggle('open'))">展开/收起</button>
      </div>

      <div class="panel-title">📝 面试前一小时速查 <span class="sub" id="cheatSummary"></span></div>

      <div class="text-muted mt-8" style="font-size:11px">空格翻答案 · j/k/l 自评</div>

    <div class="panel hidden" id="mockResult">
      <div class="panel-title">📊 本轮结果 <span class="sub" id="mockResultSub"></span></div>

      <div class="actions mt-8">
        <button class="primary" onclick="mockStart()">🔄 再来一轮</button>

<script>
/* ============ 应用状态 ============ */
const STORAGE_KEY = 'gcmp-learn-v1';
const THEME_KEY = 'gcmp-admin-theme';   // 与管理页共用，同源下主题联动
let state = loadState();
let currentCard = null;

/* ============ 主题切换 ============ */
function applyTheme(theme) {
  const safe = ['dark', 'light', 'aurora'].includes(theme) ? theme : 'dark';
  document.documentElement.setAttribute('data-theme', safe);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === safe));
  localStorage.setItem(THEME_KEY, safe);
}
function initTheme() {
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.addEventListener('click', () => applyTheme(b.dataset.theme));
  });
  window.addEventListener('storage', e => {
    if (e.key === THEME_KEY && e.newValue) applyTheme(e.newValue);
  });
}

function defaultState() {
  return { tasks: {}, mastery: {}, reviews: {}, streak: {}, notes: {}, logs: [], progress: {}, mock: [], focus: '', updatedAt: 0 };
}
function loadState() {
  try {
    const r = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return r ? { ...defaultState(), ...r } : defaultState();
  }
  catch(e) { return defaultState(); }
}
function saveState() {
  state.updatedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  updateProgress();
  syncToServer();
}

/* ============ 迷你 Markdown 渲染 ============ */
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}
function renderMD(s) {
  // 代码块先摘出占位，避免块内的 - / ** / ~ 被行内规则误伤
  const blocks = [];
  let out = String(s).replace(/:::code\n([\s\S]*?):::/g, (_, code) => {
    blocks.push(code.replace(/\n+$/, ''));
    return `\u0000C${blocks.length - 1}\u0000`;
  });
  out = esc(out)
    // 前后紧邻数字的 ~ 是数字范围（2~3、0.80~0.98），不能当行内代码定界符
    .replace(/(?<!\d)~([^~\n]+)~(?!\d)/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/^&gt; (.+)$/gm, '<blockquote style="margin:4px 0;padding:4px 8px;border-left:2px solid var(--accent);color:var(--muted)">$1</blockquote>')
    .replace(/^( *)- (.+)$/gm, (_, indent, text) =>
      `<li style="margin-left:${14 + indent.length * 9}px">${text}</li>`)
    .replace(/\n\n/g, '<br>');
  return out.replace(/\u0000C(\d+)\u0000/g, (_, i) => `<pre><code>${esc(blocks[i])}</code></pre>`);
}

/* ============ 进度更新 ============ */
function updateProgress() {
  const total = PLAN.reduce((s, w) => s + w.tasks.length, 0);
  const done = PLAN.reduce((s, w) => s + w.tasks.filter(t => state.tasks[t.id]).length, 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('planProgress').textContent = `${done} / ${total}`;
  document.getElementById('planBar').style.width = pct + '%';
  document.getElementById('progressBadge').textContent = pct + '%';
}

/* ============ Tab 切换 ============ */
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  if (btn.dataset.tab === 'flashcard') drawCard();
  if (btn.dataset.tab === 'today') { renderToday(); renderStats(); }
  if (btn.dataset.tab === 'cheat') renderCheat();
  if (btn.dataset.tab === 'mock' && !mock) mockBackToSetup();
});

/* ============ 学习计划 ============ */
function renderPlan() {
  const c = document.getElementById('planContainer');
  const focus = state.focus || '';
  c.innerHTML = PLAN.map(w => {
    const done = w.tasks.filter(t => state.tasks[t.id]).length;
    const pct = Math.round(done / w.tasks.length * 100);
    const collapsed = focus && focus !== w.id ? ' collapsed' : '';
    return `<div class="week-card${collapsed}" id="week-${w.id}">
      <h3 onclick="toggleWeek('${w.id}')">
        <span class="wk-caret">▾</span>${esc(w.week)}：${esc(w.title)}
        <span class="wk-count ${done === w.tasks.length ? 'all' : ''}">${done}/${w.tasks.length}</span>
      </h3>
      <div class="wk-body">
        <div class="why">${esc(w.why)}</div>
        <div class="output">📦 ${esc(w.output)}</div>
        <div class="progress-bar mb-8"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${w.tasks.map(t => {
          const checked = state.tasks[t.id] ? 'checked' : '';
          const note = NOTES.find(n => n.id === t.note);
          return `<div class="task-row">
            <input type="checkbox" ${checked} onclick="toggleTask('${t.id}')">
            <div onclick="this.querySelector('.task-detail').classList.toggle('open')">
              <div class="task-title ${checked}">${esc(t.title)}</div>
              <div class="task-detail ${state.tasks[t.id] ? 'open' : ''}">${esc(t.detail)}${
                note ? ` <span class="task-note" onclick="event.stopPropagation();gotoNote('${note.id}')"
                  title="跳到知识点">📖 ${esc(note.title)}</span>` : ''}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  fillFocusSelect();
  updateProgress();
}
function toggleWeek(id) {
  document.getElementById('week-' + id)?.classList.toggle('collapsed');
}
function collapseAllWeeks(yes) {
  document.querySelectorAll('.week-card').forEach(c => c.classList.toggle('collapsed', yes));
}
function setFocus(id) {
  state.focus = id;
  saveState();
  renderPlan();
  renderToday();
  const card = id && document.getElementById('week-' + id);
  if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function fillFocusSelect() {
  const sel = document.getElementById('planFocus');
  if (sel.options.length > 1) { sel.value = state.focus || ''; return; }
  PLAN.forEach(w => {
    const done = w.tasks.filter(t => state.tasks[t.id]).length;
    sel.add(new Option(`${w.week}：${w.title}（${done}/${w.tasks.length}）`, w.id));
  });
  sel.value = state.focus || '';
}
function gotoNote(id) {
  const n = NOTES.find(x => x.id === id);
  if (!n) return;
  gotoTab('kb');
  document.getElementById('kbCatFilter').value = '';
  document.getElementById('kbMasteryFilter').value = '';
  document.getElementById('kbSearch').value = n.title;
  renderKB();
  const card = document.querySelector('.kb-card');
  if (card) {
    card.querySelector('.kb-a').classList.add('open');
    card.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}
function toggleTask(id) {
  state.tasks[id] = !state.tasks[id];
  saveState();
  renderPlan();
  renderStats();
  renderToday();
}

/* ============ 知识库 ============ */
function renderKB() {
  const q = document.getElementById('kbSearch').value.toLowerCase();
  const cat = document.getElementById('kbCatFilter').value;
  const mf = document.getElementById('kbMasteryFilter').value;

  // 填充分类下拉
  const cats = [...new Set(NOTES.map(n => n.cat))];
  const sel = document.getElementById('kbCatFilter');

/* ============ 抽卡（间隔重复调度） ============ */
const DAY = 86400000;
// 连续答对次数 -> 下次间隔。固定 3 天会让已掌握的卡永久循环，到期量降不下来
const SCHEDULE = [DAY, 3 * DAY, 7 * DAY, 14 * DAY, 30 * DAY];
const LEARNING_GAP = 10 * 60000;   // 标「还行」= 10 分钟后再看，当天就能再练一次

function streakOf(id) { return (state.streak || {})[id] || 0; }

function dueAt(id) {
  const m = state.mastery[id] || 0;
  const last = state.reviews[id] || 0;
  if (!last) return 0;                 // 从没复习过 → 最高优先级
  if (m === 0) return last;            // 不会 → 立刻可再抽
  if (m === 1) return last + LEARNING_GAP;
  return last + SCHEDULE[Math.min(streakOf(id), SCHEDULE.length - 1)];
}
function isDue(id) { return dueAt(id) <= Date.now(); }
function isNew(id) { return !state.reviews[id]; }

function fcPool() {
  const cat = document.getElementById('fcCatFilter')?.value || '';
  const scope = document.getElementById('fcScope')?.value || 'due';
  let pool = cat ? NOTES.filter(n => n.cat === cat) : [...NOTES];
  if (scope === 'due') pool = pool.filter(n => isDue(n.id));
  else if (scope === 'new') pool = pool.filter(n => isNew(n.id));
  else if (scope === 'weak') pool = pool.filter(n => (state.mastery[n.id] || 0) < 2);
  return pool;
}

function drawCard() {
  let pool = fcPool();
  const scope = document.getElementById('fcScope')?.value || 'due';
  // 到期池空了不能直接判「全部掌握」：可能只是还没到下次复习时间
  if (!pool.length && scope === 'due') {
    const cat = document.getElementById('fcCatFilter')?.value || '';
    const all = cat ? NOTES.filter(n => n.cat === cat) : NOTES;
    pool = [...all].sort((a, b) => dueAt(a.id) - dueAt(b.id)).slice(0, 1);
  }
  if (pool.length === 0) {
    document.getElementById('fcQ').textContent = '🎉 当前筛选下没有可抽的卡';
    document.getElementById('fcA').innerHTML = ''; document.getElementById('fcA').classList.remove('open');
    document.getElementById('fcHint').textContent = '';
    document.getElementById('fcRelated').innerHTML = '';
    currentCard = null;
    document.getElementById('fcStats').textContent = '换个分类或范围试试';
    return;
  }
  // 新卡优先，其次挑最久没碰的；同样久的随机取一张，避免每次都是同一张
  const news = pool.filter(n => isNew(n.id));
  const bucket = news.length ? news : pool;
  const oldest = bucket.reduce((min, n) => dueAt(n.id) < dueAt(min.id) ? n : min, bucket[0]);
  const tied = bucket.filter(n => dueAt(n.id) === dueAt(oldest.id));
  currentCard = tied[Math.floor(Math.random() * tied.length)];
  document.getElementById('fcQ').textContent = currentCard.q;
  document.getElementById('fcA').innerHTML = renderMD(currentCard.a);
  document.getElementById('fcA').classList.remove('open');
  document.getElementById('fcHint').textContent = '点击卡片翻转';
  const scopeAll = NOTES;
  const newCnt = scopeAll.filter(n => isNew(n.id)).length;
  const dueCnt = scopeAll.filter(n => !isNew(n.id) && isDue(n.id)).length;
  const streak = streakOf(currentCard.id);
  document.getElementById('fcStats').textContent =
    `${currentCard.cat} · ${currentCard.title}`
    + (isNew(currentCard.id) ? ' · 新卡' : ` · 连对 ${streak} 次`)
    + ` ｜ 全库新卡 ${newCnt} 张 · 到期 ${dueCnt} 张`;
  const rel = (currentCard.qs || []).map(qid => QUESTIONS.find(q => q.id === qid)).filter(Boolean);
  document.getElementById('fcRelated').innerHTML = rel.length
    ? '关联面试题：' + rel.map(q =>
        `<span class="task-note" onclick="gotoQuestion('${q.id}')" title="去自测">🎯 ${esc(q.q)}</span>`).join(' ')
    : '';
}
function flipCard() {
  if (!currentCard) return;
  document.getElementById('fcA').classList.toggle('open');
  document.getElementById('fcHint').textContent = document.getElementById('fcA').classList.contains('open') ? currentCard.title : '点击卡片翻转';

  state.mastery[id] = level;

  saveState();
  drawCard();
}

/* 按字段合并两份进度，冲突时取 updatedAt 较新的一方，避免旧快照覆盖新进度 */
function mergeState(local, remote) {
  const lt = local.updatedAt || 0, rt = remote.updatedAt || 0;
  const winner = rt > lt ? remote : local;   // 无时间戳的旧数据视为更旧
  const out = { ...defaultState() };
  for (const field of ['tasks', 'mastery', 'reviews', 'streak', 'notes', 'progress']) {
    const a = local[field] || {}, b = remote[field] || {};
    out[field] = { ...a, ...b };
    for (const k of Object.keys(out[field])) {
      if (k in a && k in b && a[k] !== b[k]) out[field][k] = (winner[field] || {})[k];
    }
  }
  out.logs = (local.logs || []).length >= (remote.logs || []).length ? local.logs : remote.logs;
  // 模拟面试记录按 startedAt 去重合并，两端各自面过的都保留
  const byTime = new Map();
  for (const m of [...(remote.mock || []), ...(local.mock || [])]) byTime.set(m.startedAt, m);
  out.mock = [...byTime.values()].sort((a, b) => a.startedAt - b.startedAt).slice(-50);
  out.focus = (winner.focus !== undefined ? winner.focus : local.focus) || '';
  out.updatedAt = Math.max(lt, rt);
  return JSON.stringify(out) === JSON.stringify(local) ? null : out;
}

/* ============ 速查表：抽每条笔记的结论行 ============ */
// 「面试点」等显式结论词优先；找不到才退化到「面试官/坑」这类弱线索
const CHEAT_STRONG = /^\**(面试点|必答点?|工程结论|结论|关键坑|关键判断|关键点|加分点|防复发|阈值怎么定)/;
const CHEAT_WEAK = /^\**(面试官|三个坑|坑)/;

function cheatLine(note) {
  const lines = note.a
    .replace(/:::code[\s\S]*?:::/g, '')      // 代码块整段跳过，别把代码当结论
    .split('\n')
    .map(s => s.replace(/^\s*-\s*/, '').trim())
    .filter(Boolean);
  return lines.find(l => CHEAT_STRONG.test(l))
    || lines.find(l => CHEAT_WEAK.test(l))
    || lines[0] || '';
}

function renderCheat() {
  const sel = document.getElementById('cheatCatFilter');
  const cats = [...new Set(NOTES.map(n => n.cat))];
  if (sel.options.length === 1) cats.forEach(c => sel.add(new Option(c, c)));
  const cat = sel.value;
  const coreOnly = document.getElementById('cheatCoreOnly').checked;
  const weakOnly = document.getElementById('cheatWeakOnly').checked;

  let items = NOTES.filter(n => {
    if (cat && n.cat !== cat) return false;
    if (coreOnly && !n.core) return false;
    if (weakOnly && state.mastery[n.id] === 2) return false;
    return true;
  });

  const groups = [...new Set(items.map(n => n.cat))];
  document.getElementById('cheatContainer').innerHTML = groups.map(g => {
    const rows = items.filter(n => n.cat === g).map(n => {
      const m = state.mastery[n.id];
      return `<div class="cheat-row ${n.core ? 'is-core' : ''}">
        <span class="ct ${m === 2 ? 'm2' : ''}">${esc(n.title)}${m === 2 ? ' ✓' : ''}</span>
        <span class="ck">${renderMD(cheatLine(n)).replace(/<\/?li[^>]*>/g, '')}</span>
      </div>`;
    }).join('');
    return `<div class="cheat-cat">${esc(g)}（${items.filter(n => n.cat === g).length}）</div>${rows}`;
  }).join('');

  document.getElementById('cheatSummary').textContent =
    `${items.length} 条结论 · 竖线高亮 = 核心 · ✓ = 已掌握`;
}

/* ============ 模拟面试 ============ */
let mock = null;          // { queue, idx, startedAt, results:[{id,level}], timer }

function mockPool() {
  const cat = document.getElementById('mockCat').value;
  const scope = document.getElementById('mockScope').value;
  let pool = QUESTIONS.filter(q => !cat || q.cat === cat);
  if (scope === 'weak') pool = pool.filter(q => (state.mastery[q.id] ?? -1) < 2);
  return pool;
}

function mockPick(n) {
  const scope = document.getElementById('mockScope').value;
  const pool = mockPool();
  if (scope === 'all') return shuffle(pool).slice(0, n);
  // mix / weak：没答对过的优先，再按最久没复习补齐
  const weak = shuffle(pool.filter(q => (state.mastery[q.id] ?? -1) < 2));
  const rest = pool.filter(q => (state.mastery[q.id] ?? -1) === 2)
    .sort((a, b) => (state.reviews[a.id] || 0) - (state.reviews[b.id] || 0));
  return [...weak, ...rest].slice(0, n);
}
function shuffle(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

function mockStart() {
  const n = +document.getElementById('mockCount').value;
  const queue = mockPick(n);
  if (!queue.length) {
    alert('当前筛选下没有可出的题，换个范围试试');
    return;
  }
  mock = { queue, idx: 0, startedAt: Date.now(), results: [], timer: null };
  document.getElementById('mockSetup').classList.add('hidden');
  document.getElementById('mockResult').classList.add('hidden');
  document.getElementById('mockRunning').classList.remove('hidden');
  mock.timer = setInterval(mockTick, 1000);
  mockTick();
  mockRenderQ();
}

function mockTick() {
  if (!mock) return;
  const s = Math.floor((Date.now() - mock.startedAt) / 1000);
  document.getElementById('mockTimer').textContent =
    `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function mockRenderQ() {
  const q = mock.queue[mock.idx];
  document.getElementById('mockPos').textContent = `${mock.idx + 1} / ${mock.queue.length}`;
  document.getElementById('mockBar').style.width = `${mock.idx / mock.queue.length * 100}%`;
  document.getElementById('mockQ').innerHTML = `<span><span class="mock-cat">${esc(q.cat)}</span>${esc(q.q)}</span>`;
  const a = document.getElementById('mockA');
  a.innerHTML = renderMD(q.a);
  a.classList.remove('open');
  document.getElementById('mockControls').innerHTML =
    `<button class="primary" onclick="mockReveal()">👀 看答案 <kbd>空格</kbd></button>`;
}

function mockReveal() {
  document.getElementById('mockA').classList.add('open');
  document.getElementById('mockControls').innerHTML =
    `<button onclick="mockAnswer(0)">😅 答不上来 <kbd>j</kbd></button>
     <button onclick="mockAnswer(1)">🤔 说了但不全 <kbd>k</kbd></button>
     <button class="primary" onclick="mockAnswer(2)">✅ 答得上 <kbd>l</kbd></button>`;
}

function mockAnswer(level) {
  const q = mock.queue[mock.idx];
  mock.results.push({ id: q.id, level });
  state.mastery[q.id] = level;
  state.reviews[q.id] = Date.now();
  mock.idx++;
  if (mock.idx >= mock.queue.length) { mockFinish(); return; }
  saveState();
  mockRenderQ();
}

function mockFinish() {
  clearInterval(mock.timer);
  const secs = Math.floor((Date.now() - mock.startedAt) / 1000);
  const good = mock.results.filter(r => r.level === 2).length;
  state.mock = [...(state.mock || []), {
    startedAt: mock.startedAt, secs, total: mock.results.length, good,
  }].slice(-50);
  saveState();

  const rows = mock.results.map(r => {
    const q = QUESTIONS.find(x => x.id === r.id);
    const label = ['答不上来', '说了但不全', '答得上'][r.level];
    return `<div class="mock-row lv${r.level}">
      <span class="mq">${esc(q.q)}</span>
      <span class="mv">${['😅', '🤔', '✅'][r.level]} ${label}</span>
    </div>`;
  }).join('');
  const weak = mock.results.filter(r => r.level < 2);

  document.getElementById('mockResultSub').textContent =
    `${good} / ${mock.results.length} 答得上 · 用时 ${Math.floor(secs / 60)} 分 ${secs % 60} 秒 · 平均 ${Math.round(secs / mock.results.length)} 秒/题`;
  document.getElementById('mockResultBody').innerHTML = rows
    + (weak.length
      ? `<div class="mt-8 text-muted" style="font-size:12px">👉 ${weak.length} 道待补强，已写回掌握度，抽卡和今日待办会自动带上它们</div>`
      : `<div class="mt-8" style="font-size:13px;color:var(--ok)">🎉 全部答得上，换个类别或选「全部随机」加大难度</div>`);

  document.getElementById('mockRunning').classList.add('hidden');
  document.getElementById('mockResult').classList.remove('hidden');
  mock = null;
  renderQA(); renderToday(); renderStats(); renderCheat(); renderMockHistory();
}

function mockAbort() {
  if (!mock) return;
  if (mock.results.length && !confirm('退出会丢掉本轮成绩，确定？')) return;
  clearInterval(mock.timer);
  mock = null;
  mockBackToSetup();
}

function mockBackToSetup() {
  document.getElementById('mockRunning').classList.add('hidden');
  document.getElementById('mockResult').classList.add('hidden');
  document.getElementById('mockSetup').classList.remove('hidden');
  renderMockHistory();
}

function renderMockHistory() {
  const sel = document.getElementById('mockCat');
  if (sel.options.length === 1) {
    [...new Set(QUESTIONS.map(q => q.cat))].forEach(c => sel.add(new Option(c, c)));
  }
  const hist = (state.mock || []).slice(-8).reverse();
  document.getElementById('mockHistory').innerHTML = hist.length
    ? `<div class="text-muted mb-8" style="font-size:12px">最近 ${hist.length} 轮：</div>
       <div class="mock-hist">${hist.map(m => `<span class="mock-hist-item">
         ${new Date(m.startedAt).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' })}
         <b>${m.good}/${m.total}</b> · ${Math.round(m.secs / m.total)}s/题</span>`).join('')}</div>`
    : '';
}

/* ============ 学习概览 ============ */
function renderStats() {
  const mastered = NOTES.filter(n => state.mastery[n.id] === 2).length;
  const learning = NOTES.filter(n => state.mastery[n.id] === 1).length;
  const reviewed = Object.keys(state.reviews).length;
  const qaDone = QUESTIONS.filter(q => state.mastery[q.id] !== undefined).length;

  const boxes = [
    { num: `${mastered}/${NOTES.length}`, lbl: '知识点已掌握' },
    { num: learning, lbl: '正在学习中' },
    { num: `${qaDone}/${QUESTIONS.length}`, lbl: '面试题已自测' },
    { num: reviewed, lbl: '累计复习条目' },
  ];

  // 按分类看掌握度分布
  const cats = [...new Set(NOTES.map(n => n.cat))];
  const rows = cats.map(c => {
    const list = NOTES.filter(n => n.cat === c);
    const m2 = list.filter(n => state.mastery[n.id] === 2).length;
    const m1 = list.filter(n => state.mastery[n.id] === 1).length;
    return `<div class="cat-row">
      <span class="name">${c}</span>
      <span class="bar"><i class="m2" style="width:${m2 / list.length * 100}%"></i><i class="m1" style="width:${m1 / list.length * 100}%"></i></span>
      <span class="val">${m2}/${list.length}</span>
    </div>`;
  }).join('');

  document.getElementById('statsContainer').innerHTML =
    `<div class="stat-grid">${boxes.map(b => `<div class="stat-box"><div class="num">${b.num}</div><div class="lbl">${b.lbl}</div></div>`).join('')}</div>`
    + `<div class="text-muted mb-8" style="font-size:12px">分类掌握度（<span style="color:var(--ok)">绿=已掌握</span> / <span style="color:var(--warn)">黄=学习中</span>）</div>`
    + rows;
}

/* ============ 键盘快捷键 ============ */
const TAB_KEYS = { '1': 'today', '2': 'plan', '3': 'kb', '4': 'cheat', '5': 'interview', '6': 'mock', '7': 'flashcard', '8': 'resources' };
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape' && e.target.id === 'kbSearch') {
    resetKBFilters(); e.target.blur(); return;
  }
  if (typing || e.ctrlKey || e.altKey || e.metaKey) return;

  // 模拟面试进行中：独占空格与 j/k/l
  if (mock) {
    const revealed = document.getElementById('mockA').classList.contains('open');
    if (e.key === ' ') { e.preventDefault(); if (!revealed) mockReveal(); return; }
    if (revealed && 'jkl'.includes(e.key)) { mockAnswer('jkl'.indexOf(e.key)); return; }
    return;
  }

  if (e.key === '/') {                       // / 跳到知识库搜索
    e.preventDefault();
    gotoTab('kb');
    document.getElementById('kbSearch').focus();
    return;
  }
  if (TAB_KEYS[e.key]) { gotoTab(TAB_KEYS[e.key]); return; }

  // 抽卡页：空格翻牌，1/2/3 已被标签占用，故用 j/k/l 自评
  if (document.getElementById('tab-flashcard').classList.contains('active')) {
    if (e.key === ' ') { e.preventDefault(); flipCard(); }
    else if (e.key === 'n') drawCard();
    else if (e.key === 'j') markMastery(0);
    else if (e.key === 'k') markMastery(1);
    else if (e.key === 'l') markMastery(2);
  }
});

/* ============ 全部渲染 ============ */
function fillFlashcardCats() {
  const sel = document.getElementById('fcCatFilter');
  if (sel && sel.options.length === 1) {
    [...new Set(NOTES.map(n => n.cat))].forEach(c => sel.add(new Option(c, c)));
  }
}
function renderAll() { fillFlashcardCats(); renderToday(); renderStats(); renderPlan(); renderKB(); renderCheat(); renderInterview(); renderMockHistory(); renderResources(); }
initTheme();
renderAll();
loadFromServer();
</script>
